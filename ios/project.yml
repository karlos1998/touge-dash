name: TougeDash
options:
  developmentLanguage: en
  bundleIdPrefix: it.letscode
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: UCT44QZ8L4
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.4.2"
    CURRENT_PROJECT_VERSION: "20"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TOUGE_DASH_CRITICAL_ALERTS_ENABLED: NO
    CLANG_ENABLE_MODULES: YES

targets:
  TougeDash:
    type: application
    platform: iOS
    sources:
      - path: TougeDash
      - path: Shared
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    resources:
      - path: TougeDash/Resources/Assets.xcassets
      - path: TougeDash/Resources/en.lproj
      - path: TougeDash/Resources/pl.lproj
      - path: Config/PrivacyInfo.xcprivacy
    info:
      path: Config/TougeDash-Info.plist
      properties:
        CFBundleDisplayName: Touge Dash
        CFBundleName: TougeDash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BGTaskSchedulerPermittedIdentifiers:
          - it.letscode.touge-dash.video-export.*
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: it.letscode.touge-dash.auth
            CFBundleURLSchemes:
              - tougedash
        NSBluetoothAlwaysUsageDescription: Touge Dash uses Bluetooth to receive engine data and to send explicitly configured BT Switch or BT Rotary values to a compatible ECUMaster interface.
        NSBluetoothPeripheralUsageDescription: Touge Dash uses Bluetooth to receive engine data and to send explicitly configured BT Switch or BT Rotary values to a compatible ECUMaster interface.
        NSLocationWhenInUseUsageDescription: When route recording is enabled, Touge Dash records location with engine telemetry, including while the phone is locked.
        NSCameraUsageDescription: Touge Dash uses the selected camera to record a drive locally on this device.
        NSMicrophoneUsageDescription: Touge Dash can record sound with a local drive video when you enable audio.
        NSPhotoLibraryAddUsageDescription: Touge Dash saves the drive video you export to your photo library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        TougeDashCriticalAlertsEnabled: $(TOUGE_DASH_CRITICAL_ALERTS_ENABLED)
        UIBackgroundModes:
          - bluetooth-central
          - location
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/TougeDash.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.letscode.touge-dash
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.letscode.touge-dash
        PRODUCT_NAME: TougeDash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: TougeDashWidgets
        embed: true
      - target: TougeDashWatch
        embed: true

  TougeDashWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TougeDashWidgets
      - path: Shared
      - path: Config/Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    resources:
      - path: TougeDashWidgets/Resources/en.lproj
      - path: TougeDashWidgets/Resources/pl.lproj
      - path: Config/Widgets/PrivacyInfo.xcprivacy
    info:
      path: Config/TougeDashWidgets-Info.plist
      properties:
        CFBundleDisplayName: Touge Dash Cards
        CFBundleName: TougeDashWidgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/TougeDashWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.letscode.touge-dash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.letscode.touge-dash.widgets
        PRODUCT_NAME: TougeDashWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  TougeDashWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: TougeDashWatch
      - path: Shared/WatchTelemetryPayload.swift
      - path: Shared/AppLocalization.swift
      - path: Config/Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
    resources:
      - path: TougeDashWatch/Resources/WatchAssets.xcassets
      - path: TougeDashWatch/Resources/en.lproj
      - path: TougeDashWatch/Resources/pl.lproj
      - path: Config/Watch/PrivacyInfo.xcprivacy
    info:
      path: Config/TougeDashWatch-Info.plist
      properties:
        CFBundleDisplayName: Touge Dash
        CFBundleName: TougeDashWatch
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: it.letscode.touge-dash
    entitlements:
      path: Config/TougeDashWatch.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.letscode.touge-dash.watchkitapp
        PRODUCT_NAME: TougeDashWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "26.0"

  TougeDashTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TougeDashTests
    dependencies:
      - target: TougeDash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.letscode.touge-dash.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TougeDash.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TougeDash"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TougeDash:
    build:
      targets:
        TougeDash: all
        TougeDashWidgets: all
        TougeDashTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TougeDashTests
    archive:
      config: Release

  TougeDashWatch:
    build:
      targets:
        TougeDashWatch: all
    run:
      config: Debug
    archive:
      config: Release
